<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140d20">
  <meta name="description" content="משחקוני אנגלית לכיתה ח׳ עם משימות קצרות, הסברים בעברית ופרסים.">
  <title>WordQuest — אנגלית במשחק</title>
  <style>:root {
  color-scheme: light;
  --paper: #f8f6ff;
  --ink: #211735;
  --muted: #625773;
  --line: #e7dff3;
  --purple: #602ec5;
  --deep: #251344;
  --lime: #dbff82;
  --white: #fff;
  font-family: Assistant, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; min-height: 100vh; background: var(--paper); color: var(--ink); }
button, input { font: inherit; }
button, summary { cursor: pointer; }
button, a, input, summary { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid #9a5cff; outline-offset: 3px; }
button:disabled { cursor: default; opacity: .57; }
[lang="en"], [dir="ltr"] { font-family: system-ui, sans-serif; }
.sr, .skip:not(:focus) { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { z-index: 10; position: fixed; inset: 8px 8px auto auto; padding: 10px; background: white; }
.topbar { background: #fff; border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1144px; margin: auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand, .top-actions, .balance { display: flex; align-items: center; gap: 10px; }
.brand { border: 0; background: transparent; padding: 0; font-size: 23px; font-weight: 900; letter-spacing: -.06em; }
.brand > span:last-child span { color: var(--purple); }
.brand-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; color: var(--lime); background: #6530d2; box-shadow: inset 0 -3px #46209c; font-size: 25px; rotate: 6deg; }
.balance, .profile { height: 42px; min-width: 42px; justify-content: center; border-radius: 13px; border: 1px solid #e5dbfc; background: #f2ebff; }
.balance { padding-inline: 11px; color: #4b229d; }
.profile { background: #e2ffc1; border-color: #d0f1a6; font-size: 20px; }
main { width: min(100% - 48px, 1096px); margin: 0 auto; padding: 32px 0 114px; outline: none; }
h1, h2, h3, p { margin-block: 0; }
h1, h2, h3 { line-height: 1.14; overflow-wrap: anywhere; }
h1 { font-size: clamp(2.25rem, 5vw, 3.15rem); letter-spacing: -.047em; }
h2 { font-size: clamp(1.38rem, 3vw, 1.8rem); letter-spacing: -.035em; }
h3 { font-size: 1.13rem; }
p { line-height: 1.55; }
.muted { color: var(--muted); }
.greeting { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.greeting p, .page-head p { margin-top: 7px; }
.daily { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); isolation: isolate; overflow: hidden; border-radius: 26px; background: #2c1756; color: white; min-height: 271px; box-shadow: 0 9px 0 #e6d9ff; }
.daily-copy { position: relative; z-index: 1; padding: 32px 34px; }
.daily h2 { font-size: clamp(1.95rem, 4vw, 3rem); max-width: 560px; margin: 11px 0 8px; }
.daily p { color: #eadcff; }
.daily .action { margin-top: 22px; }
.eyebrow { display: inline-flex; gap: 7px; align-items: center; color: #e4ffac; font-weight: 800; font-size: .9rem; }
.hero-art { position: relative; min-width: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at center, #783ed7 0%, transparent 68%); }
.hero-art::before { content: ''; position: absolute; inset: 0; opacity: .3; background: radial-gradient(circle, #b68bff 1px, transparent 1.5px) 0 0 / 17px 17px; mask-image: radial-gradient(ellipse, #000 25%, transparent 79%); }
.ring { position: absolute; width: min(84%, 340px); height: 76%; border: 1px solid #a679eb80; border-radius: 50%; rotate: -24deg; }
.ring.second { rotate: 26deg; width: min(74%, 292px); height: 83%; }
.keys { z-index: 1; position: relative; display: flex; align-items: center; align-self: center; padding-top: 10px; direction: ltr; }
.tile { display: grid; place-items: center; width: clamp(58px, 8vw, 95px); aspect-ratio: .98; border-radius: 15px; color: #291552; font: 900 clamp(1.07rem, 4vw, 2.23rem)/1 system-ui, sans-serif; letter-spacing: -.085em; border: 2px solid #fff8; }
.tile:nth-child(1) { background: #edb8ff; rotate: -16deg; transform: translate(3px, 13px); box-shadow: 0 8px #ae63db; }
.tile:nth-child(2) { background: #deff87; rotate: -8deg; translate: 0 -18px; z-index: 2; box-shadow: 0 8px #8baa46; }
.tile:nth-child(3) { background: #b4cbff; rotate: 14deg; transform: translate(-2px, 6px); box-shadow: 0 8px #6d8ad5; }
.spark { position: absolute; color: #e1ff95; font-size: 29px; z-index: 2; }
.spark.one { inset: 15% 18% auto auto; }
.spark.two { inset: auto auto 17% 15%; color: #f4afff; font-size: 24px; }
.spark.three { inset: auto 19% 17% auto; color: #d0c0ff; font-size: 16px; }
.section { margin-top: 30px; }
.section-header { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 13px; }
.section-header p { margin-top: 4px; }
.link-button { border: 0; background: transparent; color: #5424b7; font-weight: 800; min-height: 44px; padding-inline: 4px; }
.world-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; }
.purple { --accent: #e8daff; --accent-ink: #5124aa; }
.pink { --accent: #fce0f4; --accent-ink: #8a266a; }
.blue { --accent: #dfe9ff; --accent-ink: #2c4a99; }
.lime { --accent: #e6f7c3; --accent-ink: #385415; }
.world-card { text-align: start; border: 1px solid var(--line); border-radius: 19px; padding: 16px; background: #fff; box-shadow: 0 3px #eee7f7; display: grid; gap: 8px; align-content: start; min-height: 134px; }
.world-card:hover, .mission:hover { border-color: #aa81eb; }
.world-icon { display: grid; place-items: center; width: 43px; height: 43px; border-radius: 13px; background: var(--accent); font-size: 23px; }
.world-card > span:last-child { font-size: .82rem; color: var(--accent-ink); font-weight: 750; justify-self: start; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 13px; display: flex; gap: 10px; align-items: center; }
.stat span:first-child { display: grid; place-items: center; flex: 0 0 38px; height: 38px; font-size: 19px; background: #f1eaff; border-radius: 11px; }
.stat b { display: block; font-size: 1.24rem; }
.stat small { color: var(--muted); font-size: .84rem; }
.navigation { position: fixed; z-index: 3; bottom: 0; left: 50%; translate: -50% 0; display: flex; justify-content: center; gap: 6px; min-width: min(100%, 450px); padding: 7px 10px calc(7px + env(safe-area-inset-bottom)); border: 1px solid var(--line); border-radius: 20px 20px 0 0; background: #fffffff5; box-shadow: 0 -2px 16px #36215c14; }
.navigation button { display: grid; justify-items: center; gap: 2px; flex: 1; min-width: 61px; min-height: 49px; padding: 5px 8px; border: 0; border-radius: 13px; background: transparent; color: #5e5270; font-size: .82rem; font-weight: 750; }
.navigation button span { font-size: 22px; line-height: 1; }
.navigation button[aria-current="page"] { background: #efe6ff; color: #5421b7; }
.arrowless { margin-bottom: 10px; }
.page-head { margin: 6px 0 22px; }
.paper { border: 1px solid var(--line); padding: clamp(16px, 4vw, 26px); background: white; border-radius: 22px; }
.narrow { width: min(100%, 680px); margin-inline: auto; }
.action { display: inline-flex; justify-content: center; align-items: center; gap: 7px; border-radius: 12px; background: var(--purple); color: white; border: 1px solid transparent; min-height: 46px; padding: 9px 17px; font-weight: 800; }
.action:hover:not(:disabled) { filter: brightness(.94); }
.action.luminous { color: #26133e; background: var(--lime); }
.action.secondary { background: #f0e8fd; color: #50289e; }
.action.plain { background: white; border-color: var(--line); color: #50289e; }
.action-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
.mission-list { display: grid; gap: 10px; }
.mission { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: start; gap: 8px; border: 1px solid var(--line); border-radius: 15px; padding: 13px 16px; min-height: 58px; background: #fff; font-weight: 800; }
.mission small { color: var(--muted); white-space: nowrap; font-size: .82rem; font-weight: 600; }
.world-block { margin-top: 21px; }
.world-block h2 { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.world-block p { margin-bottom: 9px; }
.passage, .answer-feedback { margin-top: 13px; border-radius: 13px; background: #f4eeff; padding: 12px 14px; line-height: 1.5; }
details summary { min-height: 31px; font-weight: 800; line-height: 1.45; }
.passage p { margin-top: 6px; }
.passage { background: #eef3ff; }
.passage p[lang="en"] { line-height: 1.62; text-align: left; }
.quiz-meta { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-weight: 750; color: var(--muted); }
progress { display: block; width: 100%; height: 11px; appearance: none; border: 0; background: #ece4f6; border-radius: 999px; overflow: hidden; }
progress::-webkit-progress-bar { background: #ece4f6; }
progress::-webkit-progress-value { background: #8146e6; }
progress::-moz-progress-bar { background: #8146e6; }
.prompt { margin: 21px 0 15px; text-align: left; font-size: clamp(1.15rem, 4vw, 1.55rem); font-weight: 800; }
.choices { display: grid; gap: 8px; }
.choice { min-height: 48px; border: 1px solid #dfd3f1; border-radius: 11px; background: white; text-align: left; padding: 9px 12px; font-weight: 700; }
.choice:disabled { opacity: 1; }
.choice:hover:not(:disabled) { border-color: #8850da; background: #f8f3ff; }
.choice.wrong { border-color: #cc6195; background: #ffe8f3; color: #78224b; }
.choice.correct { border-color: #71a050; background: #e7f7d6; color: #284b24; }
.answer-feedback:empty { display: none; }
.answer-feedback.success { background: #e7f7d6; color: #284b24; }
.answer-feedback.try { background: #fcecf5; color: #78224b; }
.hint { margin-top: 9px; }
.result { background: linear-gradient(150deg, #fff 31%, #f0e5ff); }
.result-icon { display: inline-grid; place-items: center; width: 61px; height: 61px; border-radius: 19px; background: #dfff97; font-size: 31px; margin-bottom: 14px; }
.result p { margin-top: 8px; }
.result .action-row { margin-top: 19px; }
.prize-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.prize { display: grid; justify-items: start; gap: 9px; }
.prize-icon { display: grid; place-items: center; width: 55px; height: 55px; border-radius: 15px; background: #efe6ff; font-size: 29px; }
.prize:nth-child(2n) .prize-icon { background: #ffdef3; }
.prize .action { font-size: .92rem; }
.recent li + li { margin-top: 8px; }
.form { display: grid; gap: 13px; }
.form label { display: grid; gap: 6px; font-weight: 800; }
.form input { border: 1px solid #cdc0df; border-radius: 10px; min-height: 45px; width: 100%; padding: 9px 11px; background: #fff; color: var(--ink); }
.form .action { justify-self: start; }
.status { color: #5124aa; min-height: 1.6em; }
.dictation-feature { --accent: #e2d1ff; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-block: 17px 12px; border: 1px solid #decef8; border-radius: 18px; padding: 12px; background: #f0e8fe; }
.dictation-feature h2 { font-size: clamp(1.08rem, 3vw, 1.38rem); }
.dictation-feature p { color: #54456d; font-size: .9rem; margin-top: 4px; }
.dictation-feature .world-icon { color: #5424b7; }
.dictation-intro p { margin-top: 8px; }
.dictation-table { width: 100%; border-collapse: collapse; margin-top: 14px; text-align: start; }
.dictation-table th, .dictation-table td { padding: 9px 7px; border-bottom: 1px solid var(--line); text-align: start; overflow-wrap: anywhere; }
.dictation-table thead { color: #5124aa; background: #f1e9fe; }
.dictation-table tbody tr:nth-child(even) { background: #faf7ff; }
.dictation-note { margin-top: 9px; }
.dictation-note:empty, .dictation-form .status:empty { display: none; }
.dictation-form, .dictation-feedback { margin-top: 17px; }
.dictation-form .action-row { margin-top: 0; }
.dictation-review { border-bottom: 1px solid var(--line); padding-top: 7px; margin-top: 4px; }
.dictation-review-fields { display: grid; gap: 8px; margin-block: 11px; }
.dictation-review-fields > div { background: #f8f5ff; padding: 8px 10px; border-radius: 10px; overflow-wrap: anywhere; }
.dictation-review-fields dt { font-weight: 800; }
.dictation-review-fields dd { margin: 4px 0 0; line-height: 1.5; }
.dictation-right { color: #315f1c; font-weight: 750; }
.dictation-review-needed { color: #87295d; font-weight: 750; }
@media (max-width: 740px) {
  main { width: calc(100% - 30px); padding-top: 24px; }
  .top-inner { padding-inline: 15px; }
  .world-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .daily-copy { padding: 24px 20px; }
  .daily { min-height: 230px; }
}
@media (max-width: 490px) {
  .greeting { margin-bottom: 16px; }
  .daily { grid-template-columns: minmax(0, 1fr); }
  .hero-art { grid-row: 1; height: 121px; }
  .daily-copy { padding-top: 6px; padding-bottom: 18px; }
  .daily h2 { font-size: 1.94rem; }
  .daily .action { margin-top: 14px; }
  .tile { border-radius: 12px; width: 61px; font-size: 1.4rem; }
  .spark.one { inset-inline-end: 22%; }
  .section { margin-top: 26px; }
  .world-grid, .stats { gap: 8px; }
  .world-card { min-height: 106px; padding: 11px; gap: 6px; }
  .world-icon { width: 36px; height: 36px; font-size: 20px; }
  .world-card h3 { font-size: 1rem; }
  .stat { flex-direction: column; align-items: flex-start; gap: 5px; padding: 9px; }
  .stat span:first-child { flex: auto; width: 31px; height: 31px; }
  .navigation { width: 100%; border-radius: 0; }
}
@media (max-width: 365px) {
  .dictation-feature { gap: 8px; }
  .dictation-feature .action { padding-inline: 10px; }
}

}
body { background: radial-gradient(ellipse at 26% 0%, #251735 0, transparent 530px), var(--paper); }
.topbar { background: #130e1af2; border-color: #392b45; }

.profile { background: #2c2039; }
.skip:focus { background: var(--lime); color: #17131a; }

h1, h2, h3 { letter-spacing: -.036em; }
.greeting { margin-bottom: 13px; }
.greeting h1 { font-size: clamp(1.6rem, 4vw, 2.22rem); }
.daily { position: relative; display: flex; align-items: end; min-height: 310px; isolation: isolate; border-radius: 21px; border: 1px solid #74568e; box-shadow: none; background: #21132e; }
.hero-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--art-hero) left 44% / cover no-repeat; }
.hero-art::before { content: none; }

.daily-copy { max-width: 52%; padding: 28px 34px 32px; }

.eyebrow { color: var(--lime); letter-spacing: .015em; }
.section { margin-top: 24px; }
.section-header { margin-bottom: 11px; }
.world-grid { gap: 12px; }
.purple { --accent: #382951; --accent-ink: #d6baff; }
.pink { --accent: #512743; --accent-ink: #ffc1ef; }
.blue { --accent: #27385b; --accent-ink: #b9d0ff; }

.world-card { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: end; min-height: 0; padding: 14px; aspect-ratio: 1.23; color: white; background: #150e1d; border: 1px solid var(--line); border-radius: 16px; box-shadow: none; }
.world-card:hover, .mission:hover { border-color: #b08bdb; }

.world-card::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, #120a1a 4%, #120a1ac4 29%, transparent 64%); }

.page-head { margin-bottom: 15px; }

.quiz-card { background: linear-gradient(150deg, #241a30 0%, var(--panel) 62%); }
progress { background: #392b47; }
progress::-webkit-progress-bar { background: #392b47; }
progress::-webkit-progress-value { background: #cfff73; }
progress::-moz-progress-bar { background: #cfff73; }
.choice { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink); background: #21182c; border-color: #5c486e; min-height: 51px; }

  <script>const dictationVerbs = [

  ['read', 'read', 'לקרוא', ['לקרוא']],
  ['win', 'won', 'לנצח / לזכות', ['לנצח', 'לזכות']],
  ['shut', 'shut', 'לסגור', ['לסגור', 'לטרוק']],
  ['feed', 'fed', 'להאכיל', ['להאכיל', 'להזין']]
];

const dictationFields = ['V1', 'V2', 'Meaning'];
const roundLimit = { practice: dictationVerbs.length, test: 10 };
let dictationMode = 'practice';

function dictationShortcut() {

    '<div><h2>הכנה להכתבה</h2><p>כל 20 הפעלים של המורה</p></div>' +
    action('להכנה', 'data-nav="dictation"') + '</section>';
}

function dictationHub() {
  return '<div class="narrow">' + header('הכנה להכתבה', '') +
    '<section class="paper dictation-intro"><h2>תרגול מלא</h2><p>' + english('V1 · V2 · Meaning') + ' · משוב אחרי כל פועל</p>' +
    '<div class="action-row">' + action(data.dictation.practice?.status === 'running' ? 'להמשיך בתרגול' : 'לתרגול כל 20 הפעלים', 'data-dictation-start="practice"') +
    '</div></section><section class="paper section dictation-intro"><h2>מבחן דמה</h2><p>10 פעלים באקראי · משוב בסוף</p>' +
    '<div class="action-row">' + action(data.dictation.test?.status === 'running' ? 'להמשיך במבחן' : 'להתחיל מבחן של 10 פעלים', 'data-dictation-start="test"', 'secondary') +
    (data.dictation.test?.status === 'done' ? action('לתוצאה האחרונה', 'data-dictation-result="test"', 'plain') : '') + '</div></section>' +
    '<details class="section paper"><summary class="dictation-list-summary">טבלת כל הפעלים</summary><table class="dictation-table" aria-label="רשימת הפעלים להכתבה">' +
    '<thead><tr>' + dictationFields.map(label => '<th scope="col">' + english(label) + '</th>').join('') +
    '</tr></thead><tbody>' + dictationVerbs.map(([v1, v2, meaning]) => '<tr><th scope="row">' + english(v1) + '</th><td>' + english(v2) +
    '</td><td>' + meaning + '</td></tr>').join('') + '</tbody></table>' +
    '<p class="muted dictation-note"><span lang="en" dir="ltr">New Directions</span> · עמוד 194</p><p class="muted dictation-note">ב־' + english('be') + ' כתבי את שתי צורות העבר. ב־' + english('read') + ' הכתיב זהה וההגייה שונה.</p></details></div>';
}

function currentDictation() {
  return data.dictation[dictationMode];
}

function startDictation(mode) {
  dictationMode = mode;
  if (currentDictation()?.status !== 'running') {
    const order = dictationVerbs.map((_, index) => index);
    for (let index = order.length - 1; index > 0; index--) {
      const other = Math.floor(Math.random() * (index + 1));
      [order[index], order[other]] = [order[other], order[index]];
    }
    data.dictation[mode] = { status: 'running', order: order.slice(0, roundLimit[mode]), rows: [], draft: ['', '', ''] };
    save();
  }
  go('dictationRound');
}

function dictationInput(label, index, value) {
  const instructions = ['צורת הבסיס', 'צורת העבר', 'פירוש בעברית'];

  return '<label for="dictation-' + index + '"><span>' + english(label) + ' · ' + instructions[index] + '</span>' +
    '<input id="dictation-' + index + '" data-dictation-input="' + index + '" ' + language +
    ' autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" maxlength="90" value="' + escapeHtml(value) + '"></label>';
}

function dictationRoundView() {
  const round = currentDictation();
  const feedback = dictationMode === 'practice' && round.feedback;
  const index = round.rows.length - Number(!!feedback);
  const [v1] = dictationVerbs[round.order[index]];
  const title = dictationMode === 'practice' ? 'תרגול כל 20 הפעלים' : 'מבחן דמה';
  return '<div class="narrow">' + header(title, 'הקלידי את שלושת החלקים לכל פועל.') + '<section class="paper">' +
    '<div class="quiz-meta"><span>פועל ' + (index + 1) + ' מתוך ' + round.order.length + '</span></div>' +

    '<div class="action-row">' + action('🔊 להשמיע את הפועל', 'data-dictation-speak="' + v1 + '"', 'secondary') + '</div>' +
    '<p id="dictation-audio-status" class="dictation-note" role="status"></p>' +
    '<details class="hint"><summary>הצגת הפועל בכתב</summary><p>' + english(v1) + '</p></details>' +
    (feedback ? '<div class="dictation-feedback" id="dictation-feedback" tabindex="-1">' + dictationReviewRow(round.rows[index], false) +
      '<div class="action-row">' + action(round.rows.length === round.order.length ? 'לסיכום התרגול' : 'לפועל הבא', 'data-dictation-next') + '</div></div>'
      : '<form class="form dictation-form" data-dictation-form>' + dictationFields.map((label, field) => dictationInput(label, field, round.draft[field])).join('') +
        '<div class="action-row"><button class="action" type="submit">' + (dictationMode === 'practice' ? 'לבדוק תשובה' : round.rows.length + 1 === round.order.length ? 'לסיים את המבחן' : 'לפועל הבא') +
        '</button>' + action('לדלג', 'data-dictation-skip', 'plain') + '</div>' +
        '<p class="status" id="dictation-error" role="status"></p></form>') +
    '<button type="button" class="link-button" data-nav="dictation">חזרה להכנה להכתבה</button></section></div>';
}

function meaningParts(value) {
  return value.normalize('NFKC').replace(/[\u0591-\u05BD\u05BF-\u05C7]/gu, '').split(/[,/;|]/u)
    .map(part => part.replace(/[^\p{L}\s]/gu, ' ').trim().replace(/\s+/gu, ' ')).filter(Boolean);
}

function gradeDictation(verb, answers) {
  const [v1, v2, , meanings] = verb;
  const base = answers[0].trim().toLowerCase();
  const past = answers[1].trim().toLowerCase();
  const bothPastForms = /^(?:was\s*(?:(?:\/|,|;|&|and)\s*|\s+)were|were\s*(?:(?:\/|,|;|&|and)\s*|\s+)was)$/u;
  const writtenMeanings = meaningParts(answers[2]);
  return [base === v1, v1 === 'be' ? bothPastForms.test(past) : past === v2,
    writtenMeanings.length > 0 && writtenMeanings.every(meaning => meanings.includes(meaning))];
}

function submitDictation(skip = false) {
  const round = currentDictation();
  if (round.status !== 'running' || round.feedback) return;
  const inputs = Array.from(main.querySelectorAll('[data-dictation-input]'));
  const answers = skip ? [...round.draft] : inputs.map(field => field.value.trim());
  if (!skip && answers.some(answer => !answer)) {
    document.getElementById('dictation-error').textContent = 'מלאי את שלושת השדות, או בחרי לדלג.';
    inputs[answers.findIndex(answer => !answer)].focus();
    return;
  }
  const verbIndex = round.order[round.rows.length];
  round.rows.push({ verbIndex, answers, marks: gradeDictation(dictationVerbs[verbIndex], answers) });
  round.draft = ['', '', ''];
  if (dictationMode === 'practice') {
    round.feedback = true;
    save();
    render('#dictation-feedback');
  } else {
    advanceDictation();
  }
}

function advanceDictation() {
  const round = currentDictation();
  round.feedback = false;
  if (round.rows.length < round.order.length) {
    save();
    go('dictationRound');
    return;
  }
  round.status = 'done';
  if (dictationMode === 'test') {
    const score = round.rows.filter(row => row.marks.every(Boolean)).length;
    round.earned = 3 * Math.max(0, score - (data.dictation.best ?? 0));
    data.dictation.best = Math.max(score, data.dictation.best ?? 0);
    data.total += round.earned;
    data.coins += round.earned;
  }
  save();
  go('dictationResult');
}

function dictationReviewRow(row, collapsed) {
  const verb = dictationVerbs[row.verbIndex];
  const full = row.marks.every(Boolean);
  const fields = '<dl class="dictation-review-fields">' + dictationFields.map((label, index) => {
    const renderAnswer = value => index < 2 ? english(value) : escapeHtml(value);
    return '<div><dt>' + english(label) + '</dt><dd><span class="' + (row.marks[index] ? 'dictation-right' : 'dictation-review-needed') + '">' +
      (row.marks[index] ? '✓ נכון' : 'לחזרה') + '</span> · ' + (row.answers[index] ? renderAnswer(row.answers[index]) : 'ללא תשובה') +
      (!row.marks[index] ? '<br>תשובה לדוגמה · ' + renderAnswer(verb[index]) : '') + '</dd></div>';
  }).join('') + '</dl>';
  if (!collapsed) return '<h2>' + (full ? 'כל שלושת החלקים נכונים!' : 'בואי נבדוק את שלושת החלקים') + '</h2>' + fields;
  return '<details class="dictation-review"><summary>' + english(verb[0]) + ' · ' + (full ? '✓ 3/3' : row.marks.filter(Boolean).length + '/3') + '</summary>' + fields + '</details>';
}

function dictationResultView() {
  const round = currentDictation();
  const full = round.rows.filter(row => row.marks.every(Boolean)).length;
  const fields = round.rows.reduce((count, row) => count + row.marks.filter(Boolean).length, 0);
  const review = [...round.rows].sort((a, b) => Number(a.marks.every(Boolean)) - Number(b.marks.every(Boolean)));
  const title = dictationMode === 'practice' ? 'תרגלת את כל 20 הפעלים!' : 'תוצאת מבחן הדמה';
  const canShare = dictationMode === 'test' && full >= 6;
  return '<div class="narrow">' + header(title, '') + '<section class="paper result"><h2>' + full + ' מתוך ' + round.order.length + ' פעלים מדויקים</h2>' +
    '<p>' + fields + ' מתוך ' + (round.order.length * 3) + ' חלקים נכונים.</p>' +
    (round.earned ? '<p>הרווחת <strong>' + round.earned + ' נקודות</strong> על השיפור בשיא.</p>' : '') +
    '<div class="action-row">' + action('לחזור להכנה', 'data-nav="dictation"', 'secondary') +
    (canShare ? action('לשתף את ההצלחה', 'data-dictation-share') + (data.phone ? action('לשלוח בוואטסאפ להורה', 'data-dictation-whatsapp', 'plain') : '') : '') +
    '</div><p class="status" id="share-status" role="status"></p></section><section class="section paper"><h2>בדיקת תשובות</h2>' +
    '<p class="muted dictation-note">אפשר לפתוח כל פועל ולראות את התשובה שלך לצד דוגמה.</p>' +
    review.map(row => dictationReviewRow(row, true)).join('') + '</section></div>';
}

function speakDictation(word) {
  const status = document.getElementById('dictation-audio-status');
  const unavailable = 'ההשמעה לא זמינה בדפדפן הזה. אפשר להציג את הפועל בכתב.';
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
    status.textContent = unavailable;
    return;
  }
  status.textContent = '';
  window.speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(word === 'read' ? 'reed' : word);
  speech.lang = 'en-US';
  speech.rate = 0.85;
  speech.onerror = event => {
    if (!['canceled', 'interrupted'].includes(event.error)) status.textContent = unavailable;
  };
  window.speechSynthesis.speak(speech);
}

function dictationShareText() {
  const full = currentDictation().rows.filter(row => row.marks.every(Boolean)).length;
  return 'יש לי הישג ב־WordQuest! במבחן הדמה להכתבה כתבתי נכון את כל שלושת החלקים של ' + full + ' מתוך 10 פעלים. ✨';

document.addEventListener('input', event => {
  if (!event.target.matches('[data-dictation-input]')) return;
  currentDictation().draft[Number(event.target.dataset.dictationInput)] = event.target.value;
  save();
});

document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  const flags = button.dataset;
  if (flags.dictationStart) startDictation(flags.dictationStart);
  else if (flags.dictationResult) {
    dictationMode = flags.dictationResult;
    go('dictationResult');
  } else if (flags.dictationSpeak) speakDictation(flags.dictationSpeak);
  else if ('dictationSkip' in flags) submitDictation(true);
  else if ('dictationNext' in flags) advanceDictation();
  else if ('dictationShare' in flags) void shareAchievement(dictationShareText());
  else if ('dictationWhatsapp' in flags && data.phone) {
    window.open('https://wa.me/' + data.phone + '?text=' + encodeURIComponent(dictationShareText()), '_blank', 'noopener,noreferrer');
  }
});

  <script>const storageKey = 'wordquest-v1';
const defaults = { name: '', phone: '', best: {}, total: 0, coins: 0, owned: [], equipped: '', round: null, dictation: { practice: null, test: null, best: null } };

try {

} catch { /* The app remains playable in memory. */ }

const main = document.querySelector('main');

const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

const passMark = lesson => Math.ceil(lesson.items.length * 0.6);
const cleared = lesson => (data.best[lesson.id] ?? -1) >= passMark(lesson);
const completed = () => lessons.filter(cleared).length;
const choiceOrder = [0, 1, 2];

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(data));
  } catch {
    storageFailed = true;
  }
}

function recommendation() {
  const ordered = recommendationOrder.map(id => lessonById[id]);
  return lessonById[data.round?.id] || ordered.find(lesson => !cleared(lesson))
    || ordered.find(lesson => data.best[lesson.id] < lesson.items.length) || ordered[0];
}

function header(title, copy) {
  return '<div class="page-head"><h1>' + title + '</h1>' + (copy ? '<p class="muted">' + copy + '</p>' : '') + '</div>';
}

function stats() {
  return '<div class="stats">' + [
    ['⚡', data.total, 'נקודות שנצברו'],
    ['✓', completed() + '/' + lessons.length, 'משימות שעברתי'],
    ['✧', data.owned.length, 'פריטים שאספתי']
  ].map(([icon, value, label]) => '<div class="stat"><span aria-hidden="true">' + icon + '</span><div><b>' + value + '</b><small>' + label + '</small></div></div>').join('') + '</div>';
}

function worldCards() {
  return '<div class="world-grid">' + Object.entries(worlds).map(([id, world]) =>
    '<button type="button" class="world-card ' + world.theme + '" data-world="' + id + '"><span class="world-art art-' + id +
    '" aria-hidden="true"></span><span class="world-title">' + world.name + '</span><span class="world-play" aria-hidden="true">◂</span></button>').join('') + '</div>';
}

function home() {
  const lesson = recommendation();
  const resume = data.round?.id === lesson.id;
  return '<div class="greeting"><div><h1>היי' + (data.name ? ', <bdi>' + escapeHtml(data.name) + '</bdi>' : '!') +
    '</h1></div></div>' +
    '<section class="daily"><div class="hero-art" aria-hidden="true"></div><div class="daily-copy"><span class="eyebrow"><span aria-hidden="true">✦</span>' + (resume ? 'משימה פתוחה' : 'מומלץ לך') + '</span>' +
    '<h2>' + mixedText(lesson.title) + '</h2>' +
    action(resume ? 'להמשיך במשימה' : 'מתחילות לשחק', 'data-lesson="' + lesson.id + '"', 'luminous') +
    '</div></section>' + dictationShortcut() +
    '<section class="section"><div class="section-header"><h2>באיזה עולם משחקות?</h2></div>' + worldCards() + '</section>';
}

function missionList(group) {
  return '<div class="mission-list">' + group.map(lesson => {
    const status = data.round?.id === lesson.id ? 'להמשיך' : cleared(lesson) ? '✓ עברת' : lesson.items.length + ' שאלות';
    return '<button type="button" class="mission" data-lesson="' + lesson.id + '"><span>' + mixedText(lesson.title) + '</span><small>' + status + '</small><span class="mission-play" aria-hidden="true">◂</span></button>';
  }).join('') + '</div>';
}

function learn() {
  const world = worlds[filter];
  if (world) {
    return '<div class="narrow"><button type="button" class="link-button arrowless" data-nav="learn">כל העולמות</button>' +
      '<div class="world-header ' + world.theme + '"><div class="world-art art-' + filter + '" aria-hidden="true"></div><h1>' + world.name + '</h1></div>' +
      (filter === 'verbs' ? dictationShortcut() : '') + missionList(lessons.filter(lesson => lesson.world === filter)) + '</div>';
  }
  return header('בחרי עולם', '') + worldCards() + dictationShortcut();
}

function passage(lesson, collapsible) {
  if (!lesson.passage) return '';
  const contents = '<div class="story-text" lang="en" dir="ltr">' + lesson.passage.map(paragraph => '<p>' +
    escapeHtml(paragraph) + '</p>').join('') + '</div>';
  return collapsible ? '<details class="passage" data-passage><summary>הסיפור</summary>' + contents + '</details>'
    : '<div class="passage"><h2 lang="en" dir="ltr">' + escapeHtml(lesson.textTitle) + '</h2>' + contents + '</div>';
}

function rule(lesson) {
  if (!lesson.notes) return '<p class="reading-tip">' + mixedText(lesson.rule) + '</p>';
  return '<ul class="rule-list" role="list">' + lesson.notes.map(([term, usage, ...examples]) =>
    '<li><div class="rule-usage"><span class="rule-term" dir="ltr" lang="en">' + escapeHtml(term) +
    '</span><p>' + mixedText(usage) + '</p></div><div class="rule-examples" dir="ltr" lang="en">' +
    examples.map(([before, emphasis, after = '']) => '<p>' + escapeHtml(before) + '<mark>' + escapeHtml(emphasis) +
      '</mark>' + escapeHtml(after) + '</p>').join('') + '</div></li>').join('') + '</ul>';
}

function briefing() {
  return '<div class="narrow"><div class="lesson-heading"><div class="world-art art-' + active.world +
    '" aria-hidden="true"></div>' + header(mixedText(active.title), '') + '</div><section class="paper lesson-briefing">' +
    (active.passage ? passage(active, false) : '<h2>' + (active.world === 'vocab' ? 'מילה לדוגמה' : 'כללים ודוגמאות') + '</h2>' + rule(active)) +
    '<div class="action-row">' + action('לתרגול', 'data-begin') + '<button type="button" class="link-button" data-world="' +
    active.world + '">חזרה למשימות</button></div></section></div>';
}

function quiz() {
  const round = data.round;
  const item = active.items[round.index];
  const solved = round.solved;
  return '<div class="narrow">' + header(mixedText(active.title), '') + '<section class="paper quiz-card">' +
    '<div class="quiz-meta"><span>שאלה ' + (round.index + 1) + ' מתוך ' + active.items.length + '</span></div>' +
    '<progress aria-label="התקדמות במשימה" value="' + (round.index + Number(solved)) + '" max="' + active.items.length + '"></progress>' +
    passage(active, true) + '<p class="prompt" id="prompt" tabindex="-1" dir="ltr" lang="en">' + escapeHtml(item.prompt) + '</p>' +
    '<div class="choices" role="group" aria-labelledby="prompt">' + round.orders[round.index].map(index => {
      const wrong = round.wrong.includes(index);
      const type = solved && index === 0 ? 'correct' : wrong ? 'wrong' : '';
      return '<button class="choice ' + type + '" type="button" lang="en" dir="ltr" data-choice="' + index + '"' +
        (wrong || solved ? ' disabled' : '') + '><span>' + escapeHtml(item.choices[index]) + '</span><span aria-hidden="true">' +
        (type === 'correct' ? '✓' : wrong ? '×' : '○') + '</span></button>';
    }).join('') + '</div><div class="answer-feedback ' + (solved ? 'success' : round.wrong.length ? 'try' : '') +
    '" id="feedback" tabindex="-1" role="status">' + (solved ? '<b>בדיוק!</b> ' + mixedText(item.why) :
      round.wrong.length ? '<b>נסי שוב.</b> ' + mixedText(item.hint) : round.hint ? '<b>רמז.</b> ' + mixedText(item.hint) : '') + '</div>' +
    (solved ? '<div class="action-row">' + action(round.index + 1 === active.items.length ? 'לסיכום המשימה' : 'לשאלה הבאה', 'data-next') + '</div>'
      : '<div class="quiz-tools"><button type="button" class="link-button" data-hint>✧ רמז לשאלה</button>' +
        '<details class="hint"><summary>' + (active.passage ? 'טיפ לקריאה' : active.world === 'vocab' ? 'מילה לדוגמה' : 'כללים ודוגמאות') +
        '</summary>' + rule(active) + '</details></div>') + '</section></div>';
}

function finishView() {
  const success = result.score >= passMark(active);
  const suggested = recommendation();
  return '<div class="narrow paper result"><span class="result-icon" aria-hidden="true">' + (success ? '🏆' : '✦') + '</span>' +
    '<h1>' + (success ? 'משימה עברה!' : 'סיימת את התרגול!') + '</h1><p><strong>' + mixedText(active.title) +
    '</strong> · ' + result.score + ' מתוך ' + active.items.length + ' תשובות נכונות בניסיון הראשון.</p><p>' +
    (result.earned ? 'הרווחת <strong>' + result.earned + ' נקודות</strong> לאוסף שלך.' :
      'שיפור השיא האישי יוסיף נקודות לאוסף שלך.') + '</p>' +
    '<div class="action-row">' + (success ? action('לשתף את ההצלחה', 'data-share') +
      (data.phone ? action('לשלוח בוואטסאפ להורה', 'data-whatsapp', 'secondary') : '') : '') +
    action('לשחק שוב', 'data-lesson="' + active.id + '"', 'plain') +
    action(suggested.id === active.id ? 'לכל המשימות' : 'למשימה המומלצת',
      suggested.id === active.id ? 'data-nav="learn"' : 'data-lesson="' + suggested.id + '"', success ? 'secondary' : '') +
    '</div><p class="status" id="share-status" role="status"></p></div>';
}

function progressView() {
  return header('ההתקדמות שלי', 'כל שיפור קטן מצטבר.') + stats() +
    (data.dictation.best === null ? '' : '<section class="section paper"><div class="section-header"><h2>מבחן ההכתבה</h2>' +
      action('לתרגל שוב', 'data-nav="dictation"', 'secondary') + '</div><p>השיא שלי: ' + data.dictation.best + ' מתוך 10 פעלים מלאים.</p></section>') +
    '<section class="section paper"><div class="section-header"><h2>שיאים אישיים</h2></div>' +
    (Object.keys(data.best).length ? '<div class="mission-list">' + lessons.filter(lesson => data.best[lesson.id] !== undefined).map(lesson =>
      '<button type="button" class="mission" data-lesson="' + lesson.id + '"><span>' + mixedText(lesson.title) + '</span><small>' +
      data.best[lesson.id] + ' / ' + lesson.items.length + '</small></button>').join('') + '</div>'
      : '<p class="muted">כשתסיימי משימה, השיא הראשון שלך יופיע כאן.</p>') + '</section>';
}

function rewards() {
  return header('חנות הפרסים', 'השתמשי בנקודות כדי לאסוף פריטים ולעצב את הפרופיל שלך.') +
    '<p class="status" role="status" tabindex="-1">' + (notice || 'יתרה לשימוש · ' + data.coins + ' נקודות') + '</p><div class="prize-grid">' +
    prizes.map(prize => {
      const owned = data.owned.includes(prize.id);
      const equipped = data.equipped === prize.id;
      return '<article class="paper prize"><span class="prize-icon" aria-hidden="true">' + prize.icon + '</span><h2>' + prize.title + '</h2><p class="muted">' +
        (owned ? 'באוסף שלך' : prize.cost + ' נקודות') + '</p>' +
        action(equipped ? 'בשימוש' : owned ? 'לבחור לפרופיל' : 'לקנות', 'data-prize="' + prize.id + '"' + (equipped || !owned && data.coins < prize.cost ? ' disabled' : ''), owned ? 'secondary' : '') +
        '</article>';
    }).join('') + '</div>';
}

function settings() {
  return '<div class="narrow">' + header('הפרופיל שלי', 'השם, ההתקדמות והמספר נשמרים בדפדפן הזה.') +
    '<form class="paper form"><label>איך לקרוא לך?<input id="nickname" maxlength="24" autocomplete="off" placeholder="השם או הכינוי שלי" value="' + escapeHtml(data.name) + '"></label>' +
    '<label>טלפון של ההורה לשיתוף בוואטסאפ (רשות)<input type="tel" id="phone" dir="ltr" autocomplete="off" placeholder="050-1234567" value="' +
    (data.phone ? '+' + escapeHtml(data.phone) : '') + '" aria-describedby="phone-help"></label><p id="phone-help" class="muted">אפשר להכניס מספר ישראלי או מספר עם קידומת בינלאומית. אחרי משימה מוצלחת תוכלי לפתוח הודעה ולשלוח אותה בוואטסאפ.</p>' +
    '<button class="action" type="submit">לשמור</button><p class="status" id="settings-status" role="status"></p></form></div>';
}

const views = {home, learn, briefing, quiz, result: finishView, progress: progressView, rewards, settings,
  dictation: dictationHub, dictationRound: dictationRoundView, dictationResult: dictationResultView};

function render(focus = '') {
  const openStory = !!main.querySelector('[data-passage][open]');
  document.getElementById('balance').textContent = data.coins;
  document.getElementById('avatar').textContent = prizes.find(prize => prize.id === data.equipped)?.icon || '🎧';
  document.querySelectorAll('.navigation button').forEach(button => {
    const selected = button.dataset.nav === page || (['briefing', 'quiz', 'result', 'dictation', 'dictationRound', 'dictationResult'].includes(page) && button.dataset.nav === 'learn');
    if (selected) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
  main.innerHTML = views[page]() + (storageFailed ? '<p class="status">הדפדפן לא מאפשר שמירה. ההתקדמות זמינה כל עוד המסך פתוח.</p>' : '');
  if (openStory && page === 'quiz') main.querySelector('[data-passage]')?.setAttribute('open', '');
  if (focus) main.querySelector(focus)?.focus();
}

function go(destination, world = '') {
  page = destination;
  filter = world;
  notice = '';
  render();
  window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
}

function enter(lesson) {
  active = lesson;
  if (data.round?.id === lesson.id) {
    go('quiz');
    return;
  }
  go('briefing');
}

function begin() {
  if (data.round && data.round.id !== active.id &&
    !window.confirm('יש משימה פתוחה. להתחיל משימה חדשה ולוותר על הסיבוב הפתוח?')) return;
  data.round = {
    id: active.id, index: 0, score: 0, wrong: [], solved: false, hint: false,
    orders: active.items.map(() => {
      const order = [...choiceOrder];
      for (let index = order.length - 1; index > 0; index--) {
        const other = Math.floor(Math.random() * (index + 1));
        [order[index], order[other]] = [order[other], order[index]];
      }
      return order;
    })
  };
  save();
  go('quiz');
}

function choose(index) {
  const round = data.round;
  if (round.solved || round.wrong.includes(index)) return;
  if (index === 0) {
    round.solved = true;
    if (!round.wrong.length) round.score++;
  } else {
    round.wrong.push(index);
  }
  save();
  render('#feedback');
}

function advance() {
  const round = data.round;
  if (!round.solved) return;
  if (round.index + 1 < active.items.length) {
    Object.assign(round, {index: round.index + 1, wrong: [], solved: false, hint: false});
    save();
    render('#prompt');
    return;
  }
  const previous = data.best[active.id] ?? 0;
  const earned = Math.max(0, round.score - previous) * 5 +
    (round.score >= passMark(active) && previous < passMark(active) ? 10 : 0);
  result = { score: round.score, earned };
  data.best[active.id] = Math.max(previous, round.score);
  data.coins += earned;
  data.total += earned;
  data.round = null;
  save();
  go('result');
}

function buyOrEquip(id) {
  const prize = prizes.find(item => item.id === id);
  if (!prize) return;
  if (!data.owned.includes(id)) {
    if (data.coins < prize.cost) return;
    data.coins -= prize.cost;
    data.owned.push(id);
  }
  data.equipped = id;
  notice = prize.title + ' מופיע עכשיו בפרופיל שלך.';
  save();
  render('.status');
}

function normalizePhone(input) {
  const raw = input.trim().replace(/[\s()-]/g, '');
  if (!raw) return '';
  if (/^0[2-9]\d{7,8}$/.test(raw)) return '972' + raw.slice(1);
  if (/^\+[1-9]\d{7,14}$/.test(raw)) return raw.slice(1);
  return null;
}

function shareText() {
  return 'יש לי הישג ב־WordQuest! עברתי את המשימה ״' + active.title + '״ עם ' +
    result.score + ' מתוך ' + active.items.length + ' תשובות נכונות בניסיון הראשון. ✨';
}

async function share() {
  await shareAchievement(shareText());
}

async function shareAchievement(message) {
  const status = document.getElementById('share-status');
  try {
    if (navigator.share) {
      await navigator.share({ text: message });
      return;
    }
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(message);
      status.textContent = 'ההודעה הועתקה. אפשר להדביק אותה בהודעה להורה.';
      return;
    }
  } catch (error) {
    if (error.name === 'AbortError') return;
  }
  window.prompt('אפשר להעתיק ולשלוח את ההודעה', message);
}

document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  const flags = button.dataset;
  if (flags.nav) go(flags.nav);
  else if (flags.world) go('learn', flags.world);
  else if (flags.lesson) enter(lessonById[flags.lesson]);
  else if ('begin' in flags) begin();
  else if ('choice' in flags) choose(Number(flags.choice));
  else if ('next' in flags) advance();
  else if ('hint' in flags) {
    data.round.hint = true;
    save();
    render('#feedback');
  } else if (flags.prize) buyOrEquip(flags.prize);
  else if ('share' in flags) void share();
  else if ('whatsapp' in flags && data.phone) {
    window.open('https://wa.me/' + data.phone + '?text=' + encodeURIComponent(shareText()), '_blank', 'noopener,noreferrer');
  }
});

main.addEventListener('submit', event => {
  if (event.target.matches('[data-dictation-form]')) {
    event.preventDefault();
    submitDictation();
    return;
  }
  if (page !== 'settings') return;
  event.preventDefault();
  const phoneField = document.getElementById('phone');
  const phone = normalizePhone(phoneField.value);
  const status = document.getElementById('settings-status');
  if (phone === null) {
    status.textContent = 'בדקי את המספר או הוסיפי קידומת בינלאומית שמתחילה ב־+.';
    phoneField.focus();
    return;
  }
  data.name = document.getElementById('nickname').value.trim().slice(0, 24);
  data.phone = phone;
  save();
  status.textContent = storageFailed ? 'השינויים יחולו בזמן שהמסך פתוח.' : 'ההגדרות נשמרו.';
});

render();
</script>
</body>
</html>
